[package]
name = "brickxinator-infra"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
brickxinator-core = { path = "../brickxinator-core" }
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zip = { version = "=9.2.1", default-features = false, features = ["deflate"] }
chrono = { version = "=0.4.45", features = ["serde"] }
tempfile = "=3.27.0"

[dev-dependencies]
tempfile = "=3.27.0"
